name: Nightly Build & Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: install ldid
        run: brew install ldid

      - name: build app
        run: |
          mkdir -p build
          
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -derivedDataPath build/DerivedDataApp \
            -destination 'generic/platform=iOS' \
            clean build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO"
            
          cp -r build/DerivedDataApp/Build/Products/Release-iphoneos/App.app build/App.app

          codesign --remove build/App.app || true
          rm -rf build/App.app/_CodeSignature build/App.app/embedded.mobileprovision

          cd build
          mkdir Payload
          cp -r App.app Payload/App.app
          zip -vr App.ipa Payload
          rm -rf Payload

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-ipa
          path: build/App.ipa

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download ipa
        uses: actions/download-artifact@v4
        with:
          name: App-ipa
          path: build/

      - name: update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "Nightly" \
            --prerelease
          gh release upload nightly build/App.ipa --clobber
